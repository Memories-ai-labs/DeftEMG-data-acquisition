# Catalogue of grasp and natural-task text prompts (read by deftemg_acquisition.tasks.catalogue).
#
# Add an object or a task by editing this file; no code changes are needed.
#
# Grasp blocks: one block per object. Each prompt names the object, an approach, a grasp type
# and a task variation; every allowed combination appears once per set. An object takes every
# grasp type and every variation, with one unnamed approach, unless it says otherwise:
#   approaches          approach ids from [approaches], one prompt set per approach
#   grasps              only these grasp types
#   exclude_grasps      every grasp type but these
#   approach_grasps     per approach, only these grasp types (other approaches: as above)
#   exclude_variations  every variation but these
#   note                shown with every prompt of the object
#   notes.<grasp>       shown with that grasp type's prompts
#   condition           a session condition from [conditions], asked at the session start and
#                       saved with the object's blocks
#
# Natural blocks: one block per group. A task is one or more steps; a task with variants is
# repeated for each variant ("{variant}" in a text is the variant's name, and a variant can
# give a step its own wording with text.<step>, or with text = "..." for a one-step task).
# Variants must differ in their prompt text, so the subject sees which one is meant. One
# variant's steps always run one after the other, in the order listed (e.g. loosen, then
# tighten the same fastener). est_s is the estimated time of one step; fixed_s makes a step
# run for a fixed time (and is its estimate when est_s is not given).

[catalogue]
name = "grasp_natural"

[timing]                 # the generator's session estimate (s)
countdown_s = 3
reset_s = 5              # the operator's Space for the end, the reset, the next Space
object_swap_s = 45
session_setup_s = 180
calibration_s = 90
session_limit_s = 1800

# Grasp types: the fingertips highlighted on the prompter's hand outline, or the whole hand.
[grasps.TI]
name = "thumb-index"
tips = ["thumb", "index"]

[grasps.TIM]
name = "thumb-index-middle"
tips = ["thumb", "index", "middle"]

[grasps.AD]
name = "all fingertips"
tips = ["thumb", "index", "middle", "ring", "pinky"]

[grasps.Power]
name = "power"
whole_hand = true

[[variations]]
id = "light"
text = "Light grasp"
est_s = 4

[[variations]]
id = "squeeze"
text = "Grasp and squeeze"
est_s = 6

[[variations]]
id = "pnp"
text = "Pick up and place about 30 cm away"
est_s = 8

[[variations]]
id = "pnp_sq"
text = "Pick up, squeeze while moving, place about 30 cm away"
est_s = 9

# Approach ids and the words shown for them.
[approaches]
side = "from the side"
top = "from the top"
edge = "off the edge of the table"
flat = "flat"

[conditions.bottle_fill_rubber]
ask = "Rubber water bottle: filled or empty?"
choices = ["filled", "empty"]

[conditions.bottle_fill_metal]
ask = "Metal/plastic water bottle: filled or empty?"
choices = ["filled", "empty"]

